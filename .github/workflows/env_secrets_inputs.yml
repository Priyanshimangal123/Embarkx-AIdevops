name: Demo CI Env Secrets

on:
    push
    # workflow_dispatch:
env:
    GLOBAL_App_ENV: global-dev

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            Job_App_ENV: job-dev

        steps:
            - name: Say Hello
              run: echo "hello from the second workflow"
            - name: Install
              env:
                App_ENV: dev
                DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
              run: echo "Environment $App_ENV using $DB_PASSWORD, $GLOBAL_App_ENV, $Job_App_ENV"
            - name: create demo file
              run: |
                echo "This is a demo file created by the workflow.(Hello from CI Pipeline)" > demo.txt
                echo "file created successfully." 
            - name: upload demo file
              uses: actions/upload-artifact@v4
              with:
                name: build-artifact-demo
                path: .